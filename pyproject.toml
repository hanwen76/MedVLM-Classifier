[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medvlm-classifier"
version = "0.1.0"
description = "Projector-only finetuning framework for medical VLM classification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2.0",
  "transformers>=4.45.0",
  "accelerate>=0.34.0",
  "datasets>=2.20.0",
  "pillow>=10.0.0",
  "pyyaml>=6.0.0",
  "tqdm>=4.66.0",
  "medmnist>=3.0.2",
  "numpy>=1.24.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
